# Render Blueprint — NutriDash (free tier)
# Docs: https://render.com/docs/blueprint-spec
#
# Database and Redis are NOT on Render free tier — use Neon + Upstash (see DEPLOY.md).
# Set secret env vars in the Render dashboard after the first deploy.

services:
  - type: web
    name: nutridash-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev needed for @nestjs/cli; build is deferred to start:render
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run start:render
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"  # Render default; Render also injects this automatically
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: EDAMAM_APP_ID
        sync: false
      - key: EDAMAM_APP_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # ── Google Apps Script email relay (alternative to SMTP) ──
      - key: GAS_EMAIL_URL
        sync: false
      - key: GAS_EMAIL_SECRET
        sync: false

  # ── Frontend (Next.js lives in client/ subfolder) ──
  - type: web
    name: nutridash-web
    runtime: node
    rootDir: client
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
